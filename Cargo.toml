[workspace]
resolver = "2"
members = [
  "ir/rust",
  "frontends/powerbi",
  "frontends/looker",
  "frontends/tableau",
  "frontends/bi_matrix",
  "frontends/sap_bo",
  "frontends/spotfire",
  "frontends/mstr",
  "backends/powerbi",
  "backends/looker",
  "backends/dbt",
  "backends/cube",
  "parity",
  "transpiler",
  "cli",
  "tests/mvp_roundtrip",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uni_semantic_ir = { path = "ir/rust" }
frontend_powerbi = { path = "frontends/powerbi" }
frontend_looker = { path = "frontends/looker" }
frontend_tableau = { path = "frontends/tableau" }
frontend_bi_matrix = { path = "frontends/bi_matrix" }
frontend_sap_bo = { path = "frontends/sap_bo" }
frontend_spotfire = { path = "frontends/spotfire" }
frontend_mstr = { path = "frontends/mstr" }
backend_powerbi = { path = "backends/powerbi" }
backend_looker = { path = "backends/looker" }
backend_dbt = { path = "backends/dbt" }
backend_cube = { path = "backends/cube" }
dialect_transpiler = { path = "transpiler" }
